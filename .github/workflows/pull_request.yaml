name: Fluxo de Pull Requests
on:
  pull_request:
    branches: ["main"]

jobs:
  build-e-teste-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar o repositório
        uses: actions/checkout@v4

      - name: 2. Instalar o interpretador (Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 3. Instalar as dependências
        run: npm install

      - name: 4. Executar os testes e garantir 90% de cobertura
        run: npm test
