name: Fluxo de Commits
on:
  push:
    branches: ["main"]

jobs:
  build-e-teste:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar o repositório e trocar para a branch
        uses: actions/checkout@v4

      - name: 2. Instalar o interpretador da linguagem (Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 3. Instalar as dependências do projeto
        run: npm install

      - name: 4. Executar os testes e garantir 90% de cobertura
        run: npm test
