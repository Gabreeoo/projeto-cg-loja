name: Fluxo de Commits
on:
  push:
    branches: ["main"]

jobs:
  qualidade:
    name: Qualidade (Linter, Testes e Cobertura)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar o repositório
        uses: actions/checkout@v4

      - name: 2. Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 3. Instalar as dependências
        run: npm install

      - name: 4. Verificação de Linter (ESLint)
        run: npx eslint .

      - name: 5. Testes de Unidade, Integração e Cobertura
        run: npm test
