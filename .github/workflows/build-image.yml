name: Construir imagem Docker

on:
  push:

jobs:
  build:
    name: Construir imagem da API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Construir a imagem Docker
        run: docker build --tag projeto-gc-loja:${{ github.sha }} .

  publish:
    name: Publicar imagem no DockerHub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar no DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/projeto-gc-loja:latest
            ${{ vars.DOCKERHUB_USERNAME }}/projeto-gc-loja:${{ github.sha }}
